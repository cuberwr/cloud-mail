name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

#[[d1_databases]]
#binding = "db"			#d1数据库绑定名默认不可修改
#database_name = ""		#d1数据库名字
#database_id = ""		#d1数据库id

#[vars]
#domain = []				#邮件域名可可配置多个 示例: ["example1.com","example2.com"]
#admin = ""				#管理员的邮箱	示例: admin@example.com
#admin_password = ""		# 仅供 codex-console 公共 API 使用
#jwt_secret = ""			# public token 的签名密钥
#codex_console_catch_all = true  # 开启随机邮箱 catch-all 收件
